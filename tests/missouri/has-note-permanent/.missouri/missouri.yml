assertions:
  - name: "status is permanent"
    command: "zettel note show attention-is-not-explanation --field status"
    stdout: "permanent\n"
  - name: "list status filter permanent"
    command: "zettel note list --status permanent | grep -q 'Attention'"
  - name: "list status filter draft is empty"
    command: "zettel note list --status draft"
    stdout: ""
  - name: "create with permanent status"
    command: "zettel note create 'Direct permanent note' -s permanent && zettel note list --status permanent --format json | jq -e 'length == 2'"
