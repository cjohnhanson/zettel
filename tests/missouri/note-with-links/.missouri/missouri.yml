transitions:
  - name: "create orphan note"
    command: "zettel note create 'Unrelated thought' -t random"
    target: "../has-orphan"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true

assertions:
  - name: "two notes exist"
    command: "test $(zettel note list --format json | jq 'length') -eq 2"
  - name: "backlinks to first note show second"
    command: "zettel backlinks attention-is-not-explanation | grep -q 'Transformer architecture'"
  - name: "backlinks to second note are empty"
    command: "zettel backlinks transformer-architecture"
    stdout: ""
  - name: "no orphans when notes are linked"
    command: "zettel orphans"
    stdout: ""
  - name: "show second note has link in frontmatter"
    command: "zettel note show transformer-architecture --field links | grep -q 'attention-is-not-explanation'"
  - name: "backlinks format json is valid"
    command: "zettel backlinks attention-is-not-explanation --format json | jq -e 'type == \"array\"'"
  - name: "backlinks json has one entry"
    command: "test $(zettel backlinks attention-is-not-explanation --format json | jq 'length') -eq 1"
  - name: "context shows both linked notes"
    command: "test $(zettel context attention-is-not-explanation --format json | jq 'length') -eq 2"
  - name: "context text output has both titles"
    command: "zettel context attention-is-not-explanation | grep -q 'Transformer architecture'"
  - name: "context depth 0 shows only the note itself"
    command: "test $(zettel context attention-is-not-explanation -d 0 --format json | jq 'length') -eq 1"
  - name: "search across linked notes"
    command: "zettel search 'architecture' | grep -q 'Transformer'"
  - name: "stats shows 2 notes"
    command: "zettel stats | grep -q '2 notes'"
  - name: "stats shows most connected"
    command: "zettel stats | grep -q 'backlinks'"
  - name: "where tag:ml shows both notes"
    command: "test $(zettel note list --where tag:ml --format json | jq 'length') -eq 2"
  - name: "where tag:architecture shows one note"
    command: "test $(zettel note list --where tag:architecture --format json | jq 'length') -eq 1"
  - name: "where tag:ml AND tag:architecture shows one note"
    command: "test $(zettel note list --where tag:ml --where tag:architecture --format json | jq 'length') -eq 1"
  - name: "where status:draft shows both"
    command: "test $(zettel note list --where status:draft --format json | jq 'length') -eq 2"
  - name: "where tag:nonexistent shows nothing"
    command: "zettel note list --where tag:nonexistent"
    stdout: ""
