# CLI edge behavior on a repo the assertions build up themselves. This
# state is a leaf: the note-creating assertions never leak downstream.
assertions:
  # A review stamp records that a human read the text and approved it.
  # Only 'note review --approve' writes one. Accepting one here would
  # let a writer declare its own content reviewed.
  - name: "create refuses a prestamped review attr"
    command: "! zettel note create 'Prestamped' -p 'agent:summary reviewed=2020-01-01' -b 'x' >/dev/null 2>&1 && zettel note create 'Prestamped' -p 'agent:summary reviewed=2020-01-01' -b 'x' 2>&1 >/dev/null | grep -q 'not from a written spec'"
  - name: "the refused note was not created"
    command: "zettel note list | grep -q 'Prestamped'"
    should_fail: true
  - name: "edit refuses a review attr too"
    command: "zettel note create 'Editable' -p agent:summary -b 'x' >/dev/null && ! zettel note edit editable -p 'agent:summary reviewer=cody' >/dev/null 2>&1"
  - name: "a review stamp still comes from an approval"
    command: "zettel note review editable --approve all --reviewer cody >/dev/null && zettel note show editable --field provenance | grep -q 'reviewed='"
  - name: "arbitrary attrs round-trip"
    command: "zettel note create 'Extra attr' -p 'agent:summary source=probe' -b 'x' >/dev/null && zettel note show extra-attr --field provenance"
    stdout: "agent:summary source=probe\n"
  - name: "reviewer name with spaces round-trips quoted"
    command: "zettel note review extra-attr --approve all --reviewer 'Cody J. Hanson' && zettel note show extra-attr --field provenance | grep -q 'reviewer=\"Cody J. Hanson\"'"
  - name: "reviewer without approve is ignored and lists spans"
    command: "zettel note review editable --reviewer cody | grep -q 'Editable'"
  - name: "empty provenance spec fails with a single prefix"
    command: "! zettel note create 'Bad' -p '' >/dev/null 2>&1 && zettel note create 'Bad' -p '' 2>&1 >/dev/null | grep -c 'invalid provenance' | grep -qx '1'"
  - name: "empty qualifier fails"
    command: "! zettel note create 'Bad' -p 'human:' >/dev/null 2>&1 && zettel note create 'Bad' -p 'human:' 2>&1 >/dev/null | grep -q 'empty qualifier'"
  - name: "failed create leaves no file"
    command: "test $(zettel note list --format json | jq 'length') -eq 2"
  - name: "trailing comma in the filter list fails"
    command: "zettel note list --provenance 'reviewed,'"
    should_fail: true
  - name: "space-padded filter tokens are trimmed"
    command: "zettel note list --provenance ' reviewed , unknown ' | grep -q 'Editable'"
  - name: "failed edit keeps the old provenance"
    command: "! zettel note edit editable -p '' >/dev/null 2>&1 && zettel note show editable --field provenance | grep -q 'agent:summary'"

  # Round two of the cold review: the guards the CLI was missing.
  - name: "a body marker may not carry a review stamp"
    command: "! zettel note create 'Body forge' -b '<!-- prov agent:inference reviewed=2026-01-01 -->\nx\n<!-- /prov -->' >/dev/null 2>&1"
  - name: "an inline body marker may not carry one either"
    command: "! zettel note create 'Inline forge' -b '<!-- prov human:cody reviewed=2026-01-01 -->x<!-- /prov -->' >/dev/null 2>&1"
  - name: "appending a stamped marker is refused"
    command: "! zettel note edit editable --append '<!-- prov agent:summary reviewer=nobody -->\ny\n<!-- /prov -->' >/dev/null 2>&1"
  - name: "neither forged note was written"
    command: "zettel note list | grep -qE 'Body forge|Inline forge'"
    should_fail: true
  - name: "an honest body marker is still accepted"
    command: "zettel note create 'Honest marker' -b '<!-- prov agent:inference -->\na guess\n<!-- /prov -->' >/dev/null && zettel note show honest-marker | grep -q 'a guess'"

  # An id becomes a file path, so it must name one document.
  - name: "an id that climbs out of the store is not found"
    command: "printf 'OUTSIDE\n' > ../outside.md; ! zettel note edit ../outside --append 'INJECTED' >/dev/null 2>&1"
  - name: "the outside file is untouched"
    command: "grep -qx 'OUTSIDE' ../outside.md"
  - name: "an absolute id is not found"
    command: "! zettel note edit /tmp/anything --title PWNED >/dev/null 2>&1"
  - name: "delete refuses a path too"
    command: "! zettel note delete ../outside >/dev/null 2>&1 && test -f ../outside.md"

  # A title is caller-supplied text, and '---' in it once cut the
  # document in half on the next read.
  - name: "a title holding three dashes survives an edit"
    command: "zettel note create 'Pooling --- stale reads' -p human:cody >/dev/null && zettel note edit pooling-stale-reads --add-tag bug >/dev/null && zettel note show pooling-stale-reads --field provenance | grep -q 'human:cody'"
  - name: "and keeps its tag"
    command: "zettel note show pooling-stale-reads | grep -q 'bug'"

  # A pattern arrives from the network on a served store.
  - name: "a pattern that compiles too large is refused fast"
    command: "! zettel search '[\\s\\S]{3000}zzz' >/dev/null 2>&1"
  - name: "an over-long pattern is refused"
    command: "! zettel search \"$(python3 -c 'print(\"a\"*2000)')\" >/dev/null 2>&1"
  - name: "an ordinary search still works"
    command: "zettel search 'Honest' | grep -q 'Honest marker'"

  # One unreadable file must not empty the store.
  - name: "an unreadable note is skipped, not fatal"
    command: "printf '\\xff\\xfe' > .zettel/broken-bytes.md && zettel note list | grep -q 'Editable'"
  - name: "and the count still includes the good notes"
    command: "test $(zettel note list --format json | jq 'length') -ge 2"
  - name: "check names the unreadable file"
    command: "zettel check 2>&1 | grep -q 'broken-bytes'"
  - name: "removing it clears the finding"
    command: "rm -f .zettel/broken-bytes.md && zettel check"

  # Round three: the guard read markers one way and the parser read
  # them four ways.
  - name: "a marker with no space after the comment is refused"
    command: "! zettel note create 'Spelling one' -b '<!--prov human:cody reviewed=2026-01-01 -->\nx\n<!-- /prov -->' >/dev/null 2>&1"
  - name: "a marker with two spaces is refused"
    command: "! zettel note create 'Spelling two' -b '<!--  prov human:cody reviewed=2026-01-01 -->\nx\n<!-- /prov -->' >/dev/null 2>&1"
  - name: "a decoy marker line does not hide the next one"
    command: "! zettel note create 'Spelling three' -b '<!-- prov\n<!-- prov human:cody reviewed=2026-01-01 -->\nx\n<!-- /prov -->' >/dev/null 2>&1"
  - name: "none of those notes exist"
    command: "zettel note list | grep -qE 'Spelling one|Spelling two|Spelling three'"
    should_fail: true

  # A file name comes from a directory listing, and a dependency
  # supplies the listing.
  - name: "a note file with a multi-byte name does not abort the command"
    command: "printf -- '---\ntitle: Multi byte\n---\n\nbody\n' > .zettel/abc\u65e5x.md && zettel note list | grep -q 'Multi byte'"
  - name: "and the store still reports its other notes"
    command: "zettel note list | grep -q 'Editable'"
  - name: "removing it leaves the store as it was"
    command: "rm -f .zettel/abc\u65e5x.md && zettel check"

  # The Repo and the loader must agree about which directory this
  # store holds.
  - name: "a note directory that climbs out is refused at open"
    command: "cp zettel.yml zettel.yml.bak && printf 'zettel_dir: ../outside\n' > zettel.yml; ! zettel note list >/dev/null 2>&1"
  - name: "the refusal names the reason"
    command: "zettel note list 2>&1 | grep -q 'leaves the store root'"
  - name: "restoring the config restores the store"
    command: "mv zettel.yml.bak zettel.yml && zettel note list | grep -q 'Editable'"
