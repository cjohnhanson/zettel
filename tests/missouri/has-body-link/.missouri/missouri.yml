assertions:
  - name: "two notes exist"
    command: "test $(zettel note list --format json | jq 'length') -eq 2"
  - name: "second note has no frontmatter links"
    command: "zettel note show body-link-test --field links"
    stdout: "\n"
  - name: "body link detected as backlink"
    command: "zettel backlinks attention-is-not-explanation | grep -q 'Body link test'"
  - name: "neither note is orphan because body link connects them"
    command: "zettel orphans"
    stdout: ""
  - name: "context from first note finds second via body link"
    command: "zettel context attention-is-not-explanation | grep -q 'Body link test'"
  - name: "context from second note finds first via body link"
    command: "zettel context body-link-test | grep -q 'Attention is not explanation'"
  - name: "search finds body link syntax"
    command: "zettel search 'attention-is-not-explanation' | grep -q 'Body link test'"
