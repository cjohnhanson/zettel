assertions:
  - name: "the empty agent note is flagged unreviewed"
    command: "zettel note list --unreviewed | grep -q 'Empty agent stub'"
  - name: "review lists the note header with no spans"
    command: "test $(zettel note review empty-agent-stub | grep -c '^  ') -eq 0"
  - name: "approve all stamps the default"
    command: "zettel note review empty-agent-stub --approve all --reviewer cody"
    stdout: "1 span(s) approved\n"
  - name: "the queue clears"
    command: "zettel note list --unreviewed"
    stdout: ""
  - name: "the stamp landed on the default spec"
    command: "zettel note show empty-agent-stub --field provenance | grep -q 'agent:summary reviewed=.* reviewer=cody'"
  - name: "a second approve is a no-op"
    command: "zettel note review empty-agent-stub --approve all"
    stdout: "0 span(s) approved\n"
