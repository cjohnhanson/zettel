transitions:
  - name: "edit note title"
    command: "zettel note edit attention-is-not-explanation --title 'Attention mechanisms revisited'"
    target: "../note-edited"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "add tag"
    command: "zettel note edit attention-is-not-explanation --add-tag transformers"
    target: "../tag-added"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "create second note with link"
    command: "zettel note create 'Transformer architecture' -t ml,architecture -l attention-is-not-explanation"
    target: "../note-with-links"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "delete note"
    command: "zettel note delete attention-is-not-explanation"
    target: "../note-deleted"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "set provenance to human"
    command: "zettel note edit attention-is-not-explanation --provenance human"
    target: "../has-note-human"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "append provenance spans"
    command: |
      zettel note edit attention-is-not-explanation --provenance agent:summary --append 'The paper shows attention weights are not explanations.

      <!-- prov citation:attention p=5 -->
      > Attention is not explanation.
      <!-- /prov -->

      <!-- prov agent:inference -->
      The claim probably extends to sparse attention too.
      <!-- /prov -->

      <!-- prov human:cody -->
      Checked against the follow-up paper; the claim held.
      <!-- /prov -->'
    target: "../has-provenance-spans"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "create note with body link only"
    command: "zettel note create 'Body link test' -t test -b 'References [[attention-is-not-explanation]] in body only.'"
    target: "../has-body-link"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "add dangling link"
    command: "zettel note edit attention-is-not-explanation --add-link nonexistent-note"
    target: "../has-dangling-link"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
  - name: "enter the served checks"
    command: "true"
    target: "../served"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true

  - name: "inject an invalid marker"
    command: |
      zettel note edit attention-is-not-explanation --body '<!-- prov robot -->
      mystery text
      <!-- /prov -->'
    target: "../has-invalid-marker"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true

assertions:
  - name: "note list shows note"
    command: "zettel note list | grep -q 'Attention is not explanation'"
  - name: "note list shows tags"
    command: "zettel note list | grep -q 'ml, interpretability'"
  - name: "note show has title"
    command: "zettel note show attention-is-not-explanation | grep -q 'Attention is not explanation'"
  - name: "note show field title"
    command: "zettel note show attention-is-not-explanation --field title"
    stdout: "Attention is not explanation\n"
  - name: "note show field tags"
    command: "zettel note show attention-is-not-explanation --field tags"
    stdout: "ml, interpretability\n"
  - name: "note show field links"
    command: "zettel note show attention-is-not-explanation --field links"
    stdout: "\n"
  - name: "note show format json is valid"
    command: "zettel note show attention-is-not-explanation --format json | jq -e '.title'"
  - name: "note show json has correct title"
    command: "zettel note show attention-is-not-explanation --format json | jq -r '.title'"
    stdout: "Attention is not explanation\n"
  - name: "note show json has tags"
    command: "zettel note show attention-is-not-explanation --format json | jq -r '.tags | join(\", \")'"
    stdout: "ml, interpretability\n"
  - name: "note list format json is valid array"
    command: "zettel note list --format json | jq -e 'type == \"array\"'"
  - name: "note list json has one note"
    command: "test $(zettel note list --format json | jq 'length') -eq 1"
  - name: "note is an orphan"
    command: "zettel orphans | grep -q 'Attention is not explanation'"
  - name: "backlinks are empty"
    command: "zettel backlinks attention-is-not-explanation"
    stdout: ""
  - name: "duplicate slug rejected"
    command: "zettel note create 'Attention is not explanation'"
    should_fail: true
  - name: "default provenance is unknown"
    command: "zettel note show attention-is-not-explanation --field provenance"
    stdout: "unknown\n"
  - name: "list shows provenance"
    command: "zettel note list | grep -q 'unknown'"
  - name: "list provenance filter unknown"
    command: "test $(zettel note list --provenance unknown --format json | jq 'length') -eq 1"
  - name: "list provenance filter human is empty"
    command: "zettel note list --provenance human"
    stdout: ""
  - name: "invalid provenance filter fails"
    command: "zettel note list --provenance robot"
    should_fail: true
  - name: "json provenance is null when unknown"
    command: "zettel note show attention-is-not-explanation --format json | jq -e '.provenance == null'"
  - name: "unreviewed is empty without agent content"
    command: "zettel note list --unreviewed"
    stdout: ""
  - name: "search by title"
    command: "zettel search 'Attention' | grep -q 'title'"
  - name: "search by body"
    command: "zettel search 'explanation' | grep -q 'Attention'"
  - name: "search no match"
    command: "zettel search 'nonexistent'"
    stdout: ""
  - name: "search json format is valid"
    command: "zettel search 'Attention' --format json | jq -e 'type == \"array\"'"
  - name: "search json has matched_fields"
    command: "zettel search 'Attention' --format json | jq -e '.[0].matched_fields'"
  - name: "search json includes title in matched fields"
    command: "zettel search 'Attention' --format json | jq -e '.[0].matched_fields | index(\"title\")'"
  - name: "read shows full content"
    command: "zettel read --tag ml | grep -q 'Attention is not explanation'"
  - name: "read by provenance"
    command: "zettel read --provenance unknown | grep -q 'Attention'"
  - name: "stats shows count"
    command: "zettel stats | grep -q '1 notes'"
  - name: "stats shows span counts"
    command: "zettel stats | grep -q 'spans:'"
  - name: "stats json is valid"
    command: "zettel stats --format json | jq -e '.total == 1'"
  - name: "stats json has span counts"
    command: "zettel stats --format json | jq -e '.spans.unreviewed_agent == 0'"
  - name: "check passes with no broken links"
    command: "zettel check"
    stdout: "no broken links\n"
  - name: "orphans json format"
    command: "zettel orphans --format json | jq -e 'type == \"array\"'"
  - name: "colonless where selector fails"
    command: "! zettel note list --where tagml >/dev/null 2>&1 && zettel note list --where tagml 2>&1 >/dev/null | grep -q \"invalid selector 'tagml'\""
  - name: "unknown where namespace fails"
    command: "zettel note list --where bogus:x"
    should_fail: true
  - name: "unknown show field fails naming it"
    command: "! zettel note show attention-is-not-explanation --field nope >/dev/null 2>&1 && zettel note show attention-is-not-explanation --field nope 2>&1 >/dev/null | grep -q \"unknown field 'nope'\""
  - name: "field wins over json format"
    command: "zettel note show attention-is-not-explanation --field title --format json"
    stdout: "Attention is not explanation\n"
  - name: "invalid search regex fails cleanly"
    command: "zettel search '['"
    should_fail: true
