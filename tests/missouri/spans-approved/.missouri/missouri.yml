assertions:
  - name: "unreviewed is empty after approval"
    command: "zettel note list --unreviewed"
    stdout: ""
  - name: "the inference span carries the review stamp"
    command: "zettel note show attention-is-not-explanation --format json | jq -e '[.spans[] | select(.provenance | startswith(\"agent:inference\"))] | .[0].provenance | contains(\"reviewed=\")'"
  - name: "the default spec carries the review stamp"
    command: "zettel note show attention-is-not-explanation --field provenance | grep -q 'reviewed='"
  - name: "the reviewer is recorded"
    command: "zettel note show attention-is-not-explanation --field provenance | grep -q 'reviewer=cody'"
  - name: "read filtered to reviewed shows the inference"
    command: "zettel read --provenance reviewed | grep -q 'sparse attention'"
  - name: "the human span stays unstamped"
    command: "zettel note show attention-is-not-explanation --format json | jq -e '[.spans[] | select(.provenance | startswith(\"human\"))] | .[0].provenance | contains(\"reviewed=\") | not'"
  - name: "stats shows no unreviewed agent spans"
    command: "zettel stats --format json | jq -e '.spans.unreviewed_agent == 0'"
  - name: "the body keeps its blank lines"
    command: "grep -c '^$' .zettel/*attention-is-not-explanation.md | grep -q '4'"
  - name: "check passes"
    command: "zettel check"
    stdout: "no broken links\n"
  - name: "stats shows the reviewed span counts"
    command: "zettel stats | grep -qx 'spans: 1 human, 2 agent (0 unreviewed), 1 citation, 0 unknown'"
  - name: "the list column carries the stamped spec and the title"
    command: "zettel note list | grep 'reviewed=' | grep -q 'Attention is not explanation'"
  - name: "a second approve all is a counted no-op"
    command: "zettel note review attention-is-not-explanation --approve all"
    stdout: "0 span(s) approved\n"
  - name: "re-setting the same provenance keeps the stamp"
    command: "zettel note edit attention-is-not-explanation --provenance agent:summary && zettel note show attention-is-not-explanation --field provenance | grep -q 'reviewed='"
  - name: "re-approving a span overwrites the reviewer"
    command: "zettel note review attention-is-not-explanation --approve 4 --reviewer dana && zettel note show attention-is-not-explanation --format json | jq -e '[.spans[] | select(.provenance | startswith(\"agent:inference\"))] | .[0].provenance | contains(\"reviewer=dana\")'"
  - name: "a body edit drops the default stamp"
    command: "zettel note edit attention-is-not-explanation --append 'new unreviewed thought' && zettel note show attention-is-not-explanation --field provenance | grep -q 'reviewed='"
    should_fail: true
  - name: "the edited note returns to the queue"
    command: "zettel note list --unreviewed | grep -q 'Attention'"
