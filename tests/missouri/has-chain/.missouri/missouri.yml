assertions:
  - name: "three notes exist"
    command: "test $(zettel note list --format json | jq 'length') -eq 3"
  - name: "context depth 2 from first note finds all three"
    command: "test $(zettel context attention-is-not-explanation -d 2 --format json | jq 'length') -eq 3"
  - name: "context depth 1 from first note finds only two"
    command: "test $(zettel context attention-is-not-explanation -d 1 --format json | jq 'length') -eq 2"
  - name: "context depth 1 misses the third hop"
    command: "zettel context attention-is-not-explanation -d 1 --format json | jq -e '[.[].title] | index(\"Self-attention mechanism\") == null'"
  - name: "context depth 2 includes the third hop"
    command: "zettel context attention-is-not-explanation -d 2 --format json | jq -e '[.[].title] | index(\"Self-attention mechanism\")'"
  - name: "context from third note reaches first at depth 2"
    command: "zettel context self-attention-mechanism -d 2 --format json | jq -e '[.[].title] | index(\"Attention is not explanation\")'"
  - name: "context json output has all fields"
    command: "zettel context attention-is-not-explanation --format json | jq -e '.[0].status and .[0].tags and .[0].title'"
  - name: "no orphans in chain"
    command: "zettel orphans"
    stdout: ""
  - name: "stats shows 3 notes"
    command: "zettel stats | grep -q '3 notes'"
  - name: "middle note has most backlinks"
    command: "zettel stats | grep -q 'Transformer architecture'"
