# The remote store is in the cache. Its notes read out of git objects at
# a fixed revision, so no working tree exists for a second consumer to
# overwrite.
transitions:
  - name: "bind the remote store to a local checkout"
    command: |
      printf 'stores:\n  - git: file://%s/upstream\n    path: %s/upstream\n' "$PWD" "$PWD" > .mdstore-registry.yml &&
      (cd upstream && zettel note create 'Unpushed idea' -p human:cody -b 'Not committed yet.') &&
      zettel note create 'Cites unpushed' -b 'See [[handbook:unpushed-idea]].'
    target: "../has-override"
    comparators:
      files:
        - path: ".zettel/"
          ignore: true
        - path: "upstream/"
          ignore: true
        - path: ".mdstore-cache/"
          ignore: true
        - path: ".mdstore-registry.yml"
          ignore: true
        - path: "stores.yml"
          ignore: true
        - path: "pinned/"
          ignore: true

assertions:
  - name: "the remote store reports its notes"
    command: "zettel store list | grep handbook | grep -q '1 note(s)'"
  - name: "the row shows how old the cache is"
    command: "zettel store list | grep handbook | grep -q 'synced'"
  - name: "a remote note resolves through its alias"
    command: "zettel note show handbook:handbook-entry --field title"
    stdout: "Handbook entry\n"
  - name: "a remote note prints store-qualified"
    command: "zettel note create 'My note' -b 'See [[handbook:handbook-entry]].' >/dev/null && zettel context my-note -d 1 | grep -q '^--- handbook:'"
  - name: "backlinks reach across the boundary"
    command: "zettel backlinks handbook:handbook-entry | grep -q 'My note'"
  - name: "the remote store is read-only"
    command: "! zettel note edit handbook:handbook-entry --add-tag x >/dev/null 2>&1 && zettel note edit handbook:handbook-entry --add-tag x 2>&1 >/dev/null | grep -q 'read-only'"
  - name: "a working cross-store link is not broken"
    command: "zettel check"
    stdout: "no broken links\n"
  - name: "the closure is whole, so nothing reports partial"
    command: "zettel orphans 2>&1 >/dev/null | grep -q 'partial'"
    should_fail: true

  # A second consumer pins an older revision of the same URL. Both read
  # from one bare clone, and each sees only its own revision.
  - name: "a second consumer pins an earlier revision"
    command: |
      FIRST=$(git -C upstream rev-parse HEAD) &&
      (cd upstream && zettel note create 'Later entry' -b 'Added after the pin.' >/dev/null &&
        git add -A && git commit -qm two) &&
      mkdir -p pinned && (cd pinned && zettel init >/dev/null) &&
      printf 'stores:\n  - alias: hb\n    git: file://%s/upstream\n    rev: %s\n' "$PWD" "$FIRST" > pinned/stores.yml &&
      zettel --root pinned store sync >/dev/null
  - name: "the follower sees the new note after a sync"
    command: "zettel store sync >/dev/null && zettel note show handbook:later-entry --field title"
    stdout: "Later entry\n"
  - name: "the pinned consumer does not"
    command: "zettel --root pinned note show hb:later-entry"
    should_fail: true
  - name: "and still sees the note that existed at its revision"
    command: "zettel --root pinned note show hb:handbook-entry --field title"
    stdout: "Handbook entry\n"
  - name: "both consumers share one clone"
    command: "test $(ls .mdstore-cache | wc -l) -eq 1"
