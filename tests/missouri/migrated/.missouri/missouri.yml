assertions:
  - name: "the permanent note became human"
    command: "zettel note show zz99 --field provenance"
    stdout: "human\n"
  - name: "the draft note stays unknown"
    command: "zettel note show zz98 --field provenance"
    stdout: "unknown\n"
  - name: "the status keys are gone"
    command: "! grep -q '^status:' .zettel/zz99-old-permanent-note.md && ! grep -q '^status:' .zettel/zz98-old-draft-note.md && ! grep -q '^status:' .zettel/zz97-old-both-keys.md"
  - name: "an existing provenance is not clobbered"
    command: "zettel note show zz97 --field provenance"
    stdout: "agent:summary\n"
  - name: "a second migrate changes nothing"
    command: "zettel migrate"
    stdout: "nothing to migrate\n"
  - name: "the bodies survive"
    command: "zettel read --provenance human | grep -q 'Old wisdom.'"
