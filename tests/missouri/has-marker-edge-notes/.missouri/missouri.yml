assertions:
  - name: "double open implicitly closes the first span"
    command: "test $(zettel note review double-open | grep -c '^  ') -eq 2"
  - name: "double open second span keeps its own provenance"
    command: "zettel note review double-open | grep -q 'human:cody  two'"
  - name: "stray close stays plain text"
    command: "test $(zettel note review stray-close | grep -c '^  ') -eq 1"
  - name: "stray close is not a broken anything"
    command: "zettel note show stray-close --field body | grep -q '<!-- /prov -->'"
  - name: "empty agent span lists"
    command: "zettel note review empty-agent-span | grep -q 'agent:index'"
  - name: "long first line truncates with an ellipsis"
    command: "zettel note review long-excerpt | grep -q '…'"
  - name: "indented markers are recognized"
    command: "zettel read --provenance human | grep -q 'indented human text'"
  - name: "quoted citation attrs parse"
    command: "zettel note review quoted-citation-attrs | grep -q 'citation:ddia src=https://example.com/a?b=1 title=\"Data Intensive Apps\" p=212'"
  # Mutating steps last: they must not precede the listing checks.
  - name: "empty agent span approves"
    command: "zettel note review empty-agent-span --approve all"
    stdout: "1 span(s) approved\n"
  - name: "quoted attrs survive an approve rewrite verbatim"
    command: "zettel note review quoted-citation-attrs --approve all >/dev/null && grep -q 'citation:ddia src=https://example.com/a?b=1 title=\"Data Intensive Apps\" p=212' .zettel/*quoted-citation-attrs.md"
  - name: "check passes on every edge note"
    command: "zettel check"
    stdout: "no broken links\n"
