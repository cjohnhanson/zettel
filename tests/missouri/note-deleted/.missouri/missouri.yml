assertions:
  - name: "note list is empty after delete"
    command: "zettel note list"
    stdout: ""
  # Greps stderr instead of matching the whole stream: the nix sandbox
  # wrapper prepends a deprecation warning.
  - name: "show deleted note fails"
    command: "! zettel note show attention-is-not-explanation >/dev/null 2>&1 && zettel note show attention-is-not-explanation 2>&1 >/dev/null | grep -q \"error: note 'attention-is-not-explanation' not found\""
