# The review gate. This file is deliberately not generated by gaff.
#
# `pull_request_target` takes the workflow and every file it reads from
# the base branch, not from the pull request. The policy in
# .gaff/gaff.yml, the criteria under .agents/skills, and this file all
# come from main, so a branch cannot weaken the check that judges it. A
# `pull_request` trigger reads them from the merge commit, which lets a
# branch approve itself.
#
# Nothing here checks out or runs the pull request's code. The job reads
# one sha from the event payload and one git note. Running head code
# under pull_request_target is the known way to break it.
#
# gaff judges the note. `gaff reviews check` is the check the pre-push
# hook runs, fed the same one line git writes for a pushed ref, so the
# sha floor, the evidence floor, and every refusal live in gaff and
# nowhere else.
name: 'review-gate'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: 'ubuntu-latest'
    steps:
      # No ref given, so this is the base branch: main's policy and
      # main's criteria.
      - uses: actions/checkout@v4

      # The action installs gaff from gaff's own main. `run: 'false'`
      # keeps it from running the hooks, which would need the head's
      # code.
      - name: 'gaff'
        uses: 'cjohnhanson/gaff@main'
        with:
          run: 'false'

      - name: 'fetch the review notes and the head commit'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin '+refs/notes/reviews:refs/notes/reviews' || true
          git fetch --no-tags origin "$HEAD_SHA"

      - name: 'every declared review signed off on the head commit'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          case "$HEAD_SHA" in
            [0-9a-f]*) ;;
            *) echo "review-gate: the head sha is unreadable. Refusing." >&2; exit 1 ;;
          esac

          # The policy is main's, because this checkout is main's. A
          # policy with no `reviews:` key is gaff's refusal, with gaff's
          # message.
          required=$(gaff reviews) || exit 1
          if [ -z "$required" ]; then
            echo "review-gate: ok, the base branch requires no review"
            exit 0
          fi

          # One ref line, the shape git writes to a pre-push hook: the
          # head as the pushed tip, main as the remote ref. The check
          # reads the note on the tip and refuses the same faults it
          # refuses on a push.
          zero=0000000000000000000000000000000000000000
          if ! printf 'refs/heads/head %s refs/heads/main %s\n' "$HEAD_SHA" "$zero" | gaff reviews check; then
            echo "review-gate: $HEAD_SHA is refused. Record every line in one note, then push refs/notes/reviews:" >&2
            echo "    git notes --ref=reviews add -m '<the lines>' $HEAD_SHA" >&2
            exit 1
          fi

          echo "review-gate: ok, enforced on $HEAD_SHA:$(printf ' %s' $required)"
