[package]
name = "zettel"
version = "0.2.0"
edition = "2024"
description = "Zettelkasten note management on frontmattered markdown"
license = "MIT"
repository = "https://github.com/cjohnhanson/zettel"
homepage = "https://github.com/cjohnhanson/zettel"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["zettelkasten", "notes", "markdown", "knowledge-base", "cli"]
categories = ["command-line-utilities"]

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
mdstore = { path = "../mdstore" }  # TEMPORARY: pin the rev before merge
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"