[package]
name = "zettel"
version = "0.2.0"
edition = "2024"
description = "Zettelkasten note management on frontmattered markdown"
license = "MIT"
repository = "https://github.com/cjohnhanson/zettel"
homepage = "https://github.com/cjohnhanson/zettel"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["zettelkasten", "notes", "markdown", "knowledge-base", "mcp"]
categories = ["command-line-utilities", "text-processing"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    # Shells out to scripts/merge-gate.sh, which the line above drops.
    "tests/merge_gate_guard.rs",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
mdstore = { git = "https://github.com/cjohnhanson/mdstore", rev = "376040b", features = ["mcp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
sigpipe = "0.1.3"
