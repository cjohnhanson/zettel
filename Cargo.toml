[package]
# The registry name. `zettel` there belongs to an unrelated project,
# and a registry name is first-come and permanent. `[[bin]] name`
# below keeps the typed command as `zettel`; only the install line
# carries the qualified name.
name = "zttl"
version = "0.2.0"
edition = "2024"
description = "Zettelkasten note management on frontmattered markdown"
license = "MIT"
repository = "https://github.com/cjohnhanson/zettel"
homepage = "https://github.com/cjohnhanson/zettel"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["zettelkasten", "notes", "markdown", "knowledge-base", "mcp"]
categories = ["command-line-utilities", "text-processing"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

# The import path stays `zettel`, so no source changes when the
# registry name does.
[lib]
name = "zettel"

# The command a user types stays `zettel`. A package name and a binary
# name are independent, so only the install line carries the
# qualified one.
[[bin]]
name = "zettel"
path = "src/main.rs"

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
# The registry name is mdstore-core; `package` keeps the import path
# as `mdstore`, so no source in this crate changes. A path override
# for local work belongs in .cargo/config.toml, never here.
mdstore = { version = "0.3", package = "mdstore-core", features = ["mcp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
sigpipe = "0.1.3"

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
